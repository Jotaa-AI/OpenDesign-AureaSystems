140f">15+</text><text y="24" text-anchor="middle" font-family="JetBrains Mono" font-size="11" letter-spacing="2" fill="#5a5448">VISITAS</text></g><text x="128" y="864" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.2" fill="#5a5448">CIUDAD · ESPECIALIDAD · PROBLEMA RESUELTO</text><text x="42" y="982" font-family="Playfair Display, Georgia, serif" font-size="30" font-style="italic" fill="#8b8676">Nº 15</text>
