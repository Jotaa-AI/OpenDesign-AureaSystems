<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurea Systems — Sistema comercial para clínicas</title>
  <meta name="description" content="Aurea Systems conecta captación, WhatsApp, cualificación y seguimiento para que tu clínica responda antes, filtre mejor y reduzca citas perdidas." />
  <link rel="icon" type="image/png" href="./assets/aurea-logo-mark.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'serif'],
            body: ['"Barlow"', 'sans-serif'],
          },
          borderRadius: { DEFAULT: '9999px' },
          colors: {
            'aurea-deep': '#0A0908',
            'aurea-soft': '#13110F',
            'aurea-ink': '#1B1916',
            'aurea-gold': '#C9A668',
            'aurea-bgold': '#E0BE7A',
            'aurea-dgold': '#9B7D3F',
            'aurea-cream': '#F5F1E8',
            'aurea-bone': '#E8E2D3',
            'aurea-ash': '#8B8680',
            'aurea-sash': '#5C5A55',
            'aurea-red': '#A4503D',

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <!-- Babel standalone -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>window.Motion = window.FramerMotion;</script>

  <style>
    html, body { background: #0A0908; }
    body {
      font-family: 'Barlow', sans-serif;
      color: #F5F1E8;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .liquid-glass {
      background: rgba(245,241,232,0.025);
      background-blend-mode: luminosity;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(245,241,232,0.12);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.2px;
      background: linear-gradient(180deg,
        rgba(224,190,122,0.55) 0%,
        rgba(224,190,122,0.22) 20%,
        rgba(245,241,232,0) 42%,
        rgba(245,241,232,0) 58%,
        rgba(224,190,122,0.18) 80%,
        rgba(224,190,122,0.48) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(201,166,104,0.07);
      background-blend-mode: luminosity;
      backdrop-filter: blur(45px);
      -webkit-backdrop-filter: blur(45px);
      border: none;
      box-shadow:
        4px 4px 16px rgba(0,0,0,0.22),
        inset 0 1px 1px rgba(245,241,232,0.18);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(224,190,122,0.65) 0%,
        rgba(224,190,122,0.28) 20%,
        rgba(245,241,232,0) 42%,
        rgba(245,241,232,0) 58%,
        rgba(224,190,122,0.24) 80%,
        rgba(224,190,122,0.6) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* keep card content above the gradient ::before border layer */
    .liquid-glass > *,
    .liquid-glass-strong > * { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const { motion } = window.Motion;

    /* ============================================================
     *  Icons (inline SVG, currentColor, stroke=2 round)
     * ========================================================== */
    const Svg = ({ children, className = "w-5 h-5" }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
           strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
        {children}
      </svg>
    );
    const ArrowUpRight = (p) => <Svg {...p}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Svg>;
    const Play = (p) => <Svg {...p}><polygon points="6 3 20 12 6 21 6 3"/></Svg>;
    const Target = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Svg>;
    const MessageCircle = (p) => <Svg {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></Svg>;
    const Filter = (p) => <Svg {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Svg>;
    const BellRing = (p) => <Svg {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/><path d="M22 8c0-2.3-.8-4.3-2-6"/></Svg>;
    const CalendarCheck = (p) => <Svg {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></Svg>;
    const ShieldCheck = (p) => <Svg {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></Svg>;

    /* ============================================================
     *  FadingVideo — manual rAF crossfade, seamless loop on `ended`
     * ========================================================== */
    const FadingVideo = ({ src, className, style }) => {
      const ref = useRef(null);
      const rafRef = useRef(null);
      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      const fadeTo = (target, duration = FADE_MS) => {
        const video = ref.current;
        if (!video) return;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        const start = parseFloat(video.style.opacity || '0');
        const startTime = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          video.style.opacity = String(start + (target - start) * t);
          if (t < 1) rafRef.current = requestAnimationFrame(step);
          else rafRef.current = null;
        };
        rafRef.current = requestAnimationFrame(step);
      };

      useEffect(() => {
        const video = ref.current;
        if (!video) return;

        const onLoaded = () => {
          video.style.opacity = '0';
          video.play().catch(() => {});
          fadeTo(1);
        };
        const onTimeUpdate = () => {
          const remaining = (video.duration || 0) - video.currentTime;
          if (remaining <= FADE_OUT_LEAD && remaining > 0) fadeTo(0);
        };
        const onEnded = () => {
          video.style.opacity = '0';
          setTimeout(() => {
            try { video.currentTime = 0; } catch (e) {}
            video.play().catch(() => {});
            fadeTo(1);
          }, 100);
        };

        video.addEventListener('loadeddata', onLoaded);
        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('ended', onEnded);

        return () => {
          video.removeEventListener('loadeddata', onLoaded);
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('ended', onEnded);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [src]);

      return (
        <video
          ref={ref}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ opacity: 0, ...style }}
        />
      );
    };

    /* ============================================================
     *  BlurText — word-by-word blur-in driven by IntersectionObserver
     * ========================================================== */
    const BlurText = ({ text, className, baseDelay = 0 }) => {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setVisible(true);
              io.disconnect();
            }
          });
        }, { threshold: 0.1 });
        io.observe(el);
        return () => io.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <div
          ref={ref}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {words.map((w, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={
                visible
                  ? {
                      filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : {}
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: 'easeOut',
                delay: baseDelay + i * 0.1,
              }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {w}
            </motion.span>
          ))}
        </div>
      );
    };

    /* ============================================================
     *  Reusable entrance preset
     * ========================================================== */
    const enter = (delay = 0) => ({
      initial: { filter: 'blur(10px)', opacity: 0, y: 20 },
      animate: { filter: 'blur(0px)', opacity: 1, y: 0 },
      transition: { duration: 0.7, ease: 'easeOut', delay },
    });

    /* ============================================================
     *  Navbar
     * ========================================================== */
    const NAV_LINKS = ['Sistema', 'Proceso', 'Clínicas', 'Resultados', 'Reunión'];

    const Navbar = () => (
      <nav className="fixed top-4 left-0 right-0 z-50 px-8 lg:px-16 flex items-center justify-between pointer-events-none">
        <div className="liquid-glass w-12 h-12 rounded-full flex items-center justify-center pointer-events-auto">
          <span className="text-[#F5F1E8] font-heading italic text-2xl leading-none lowercase">a</span>
        </div>
        <div className="hidden md:flex liquid-glass rounded-full px-1.5 py-1.5 items-center gap-1 pointer-events-auto">
          {NAV_LINKS.map((label) => (
            <a
              key={label}
              href={'#' + label.toLowerCase().replace('ó', 'o').replace('í', 'i')}
              className="px-3 py-2 text-sm font-medium text-[#F5F1E8]/90 font-body hover:text-[#F5F1E8] transition-colors"
            >
              {label}
            </a>
          ))}
          <a
            href="#reservar"
            className="bg-[#F5F1E8] text-[#0A0908] rounded-full px-4 py-2 text-sm font-medium inline-flex items-center gap-1.5 ml-1 hover:bg-white transition-colors"
          >
            Agendar diagnóstico <ArrowUpRight className="w-4 h-4" />
          </a>
        </div>
        <div className="w-12 h-12" aria-hidden="true" />
      </nav>
    );

    /* ============================================================
     *  Section 1 — Hero
     * ========================================================== */
    const Hero = () => {
      const stats = [
        { Icon: MessageCircle, n: '< 1 min', l: 'Primera respuesta al lead' },
        { Icon: CalendarCheck, n: '5 fases', l: 'Del anuncio a la consulta' },
        { Icon: ShieldCheck,   n: '- No-Show', l: 'Seguimiento antes de la cita' },
      ];
      const partners = ['Captación', 'WhatsApp', 'Cualificación', 'Seguimiento', 'Pacientes'];

      return (
        <section id="hero" className="relative min-h-screen overflow-hidden" style={{ background: '#0A0908' }}>
          <FadingVideo
            src="/videos/aurea-hero-patient-flow.mp4"
            className="absolute left-1/2 top-0 -translate-x-1/2 object-cover object-center z-0"
            style={{ width: '120%', height: '120%' }}
          />
          <div
            className="absolute inset-0 z-[1] pointer-events-none"
            style={{ background: 'radial-gradient(circle at center, rgba(10,9,8,0.1), rgba(10,9,8,0.55))' }}
            aria-hidden="true"
          />

          <Navbar />

          <div className="relative z-10 min-h-screen flex flex-col items-center px-4 pt-24 pb-8 text-center">
            <div className="flex-1 flex flex-col items-center justify-center w-full">
              <motion.div
                {...enter(0.4)}
                className="liquid-glass rounded-full inline-flex items-center gap-3 pl-1 pr-3 py-1"
              >
                <span className="bg-[#F5F1E8] text-[#0A0908] px-3 py-1 text-xs font-semibold rounded-full font-body tracking-wide">
                  Nuevo enfoque
                </span>
                <span className="text-sm text-[#F5F1E8]/90 pr-3 font-body">
                  Un sistema comercial para clínicas que no quieren depender solo de publicar más
                </span>
              </motion.div>

              <BlurText
                text="Convierte más consultas en pacientes reales"
                baseDelay={0.6}
                className="text-5xl sm:text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-[#F5F1E8] leading-[0.82] max-w-3xl tracking-[-4px] mt-7"
              />

              <motion.p
                {...enter(0.8)}
                className="mt-5 text-sm md:text-base text-[#E8E2D3]/90 max-w-2xl font-body font-light leading-tight"
              >
                Aurea Systems conecta captación, WhatsApp, cualificación y seguimiento para que tu clínica responda antes, filtre mejor y reduzca citas perdidas.
              </motion.p>

              <motion.div {...enter(1.1)} className="flex items-center gap-6 mt-7 flex-wrap justify-center">
                <a
                  href="#proceso"
                  className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-[#F5F1E8] inline-flex items-center gap-2 hover:text-white transition-colors"
                >
                  Ver cómo funciona <ArrowUpRight className="w-4 h-4" />
                </a>
                <a
                  href="#reservar"
                  className="text-sm text-[#F5F1E8]/90 inline-flex items-center gap-2 hover:text-[#F5F1E8] transition-colors font-body"
                >
                  <Play className="w-4 h-4" /> Solicitar diagnóstico
                </a>
              </motion.div>

              <motion.div
                {...enter(1.3)}
                className="flex flex-col md:flex-row items-stretch gap-4 mt-9 w-full max-w-3xl mx-auto justify-center"
              >
                {stats.map(({ Icon, n, l }, i) => (
                  <div
                    key={i}
                    className="liquid-glass rounded-[1.25rem] p-5 w-full md:w-[220px] flex flex-col items-start text-left"
                  >
                    <div className="text-[#F5F1E8] mb-3"><Icon className="w-5 h-5" /></div>
                    <div className="font-heading italic text-[#F5F1E8] text-4xl tracking-[-1px] leading-none">{n}</div>
                    <div className="text-xs text-[#E8E2D3]/90 font-body font-light mt-2">{l}</div>
                  </div>
                ))}
              </motion.div>
            </div>

            <motion.div {...enter(1.4)} className="flex flex-col items-center gap-4 pb-2 w-full">
              <span className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-[#F5F1E8] font-body">
                Diseñado para clínicas de estética que quieren más control comercial
              </span>
              <div className="flex flex-wrap items-center justify-center gap-x-8 md:gap-x-12 gap-y-2 font-heading italic text-2xl md:text-3xl tracking-tight text-[#F5F1E8]">
                {partners.map((p, i) => (
                  <React.Fragment key={p}>
                    <span>{p}</span>
                    {i < partners.length - 1 && <span className="text-[#C9A668]/50 hidden sm:inline">·</span>}
                  </React.Fragment>
                ))}
              </div>
            </motion.div>
          </div>
        </section>
      );
    };

    /* ============================================================
     *  Section 2 — PatientFlow Capabilities
     * ========================================================== */
    const CARDS = [
      {
        step: 'Paso 01', title: 'Captación', Icon: Target,
        body: 'Anuncios y piezas de entrada pensadas para atraer personas con intención real de valoración, no solo curiosos.',
        tags: ['Meta Ads', 'Landing', 'Lead Magnet', 'Valoración'],
      },
      {
        step: 'Paso 02', title: 'Comunicación', Icon: MessageCircle,
        body: 'El lead recibe una respuesta rápida, clara y humana por WhatsApp, sin depender de que recepción pueda contestar al momento.',
        tags: ['WhatsApp', 'Respuesta rápida', 'Tono humano', 'Derivación'],
      },
      {
        step: 'Paso 03', title: 'Cualificación', Icon: Filter,
        body: 'El sistema detecta necesidad, zona, urgencia, franja horaria y calidad del lead antes de empujar la reserva.',
        tags: ['Lead scoring', 'Filtros', 'Intención', 'Contexto'],
      },
      {
        step: 'Paso 04', title: 'Asistencia', Icon: BellRing,
        body: 'Recordatorios, reactivaciones y mensajes previos reducen olvidos, dudas y cancelaciones de última hora.',
        tags: ['Recordatorios', 'Seguimiento', 'Confirmación', 'No-Show'],
      },
      {
        step: 'Paso 05', title: 'Cierre', Icon: CalendarCheck,
        body: 'El objetivo no es cerrar tratamientos por chat. El objetivo es llevar a la persona correcta a una primera consulta.',
        tags: ['Cita', 'Agenda', 'Paciente', 'Control'],
      },
    ];

    const PatientCard = ({ c, i }) => {
      const [hover, setHover] = useState(false);
      const Icon = c.Icon;
      return (
        <motion.article
          initial={{ opacity: 0, y: 24, filter: 'blur(10px)' }}
          whileInView={{ opacity: 1, y: 0, filter: 'blur(0px)' }}
          transition={{ duration: 0.6, ease: 'easeOut', delay: i * 0.08 }}
          viewport={{ once: true, amount: 0.2 }}
          animate={{ y: hover ? -6 : 0 }}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          className="liquid-glass rounded-[1.25rem] p-5 min-h-[340px] flex flex-col"
        >
          <div className="flex items-start justify-between gap-4">
            <div className="liquid-glass w-11 h-11 rounded-[0.75rem] flex items-center justify-center text-[#F5F1E8]">
              <Icon className="w-5 h-5" />
            </div>
            <span className="text-[11px] text-[#C9A668] font-body tracking-wide uppercase">{c.step}</span>
          </div>

          <div className="flex-1" />

          <div>
            <h3 className="font-heading italic text-[#F5F1E8] text-3xl md:text-4xl tracking-[-1px] leading-none">
              {c.title}
            </h3>
            <p className="mt-3 text-sm text-[#E8E2D3]/90 font-body font-light leading-snug">
              {c.body}
            </p>
            <motion.div
              animate={{ opacity: hover ? 1 : 0.85 }}
              transition={{ duration: 0.3 }}
              className="mt-5 flex flex-wrap gap-1.5"
            >
              {c.tags.map((t) => (
                <span
                  key={t}
                  className="liquid-glass rounded-full px-3 py-1 text-[11px] text-[#F5F1E8]/90 font-body whitespace-nowrap"
                >
                  {t}
                </span>
              ))}
            </motion.div>
          </div>

          <motion.div
            aria-hidden="true"
            initial={{ opacity: 0 }}
            animate={{ opacity: hover ? 1 : 0 }}
            transition={{ duration: 0.35 }}
            className="absolute inset-0 rounded-[1.25rem] pointer-events-none"
            style={{
              background:
                'radial-gradient(circle at 50% 0%, rgba(201,166,104,0.16), transparent 60%)',
              zIndex: 0,
            }}
          />
        </motion.article>
      );
    };

    const Capabilities = () => (
      <section
        id="proceso"
        className="relative min-h-screen overflow-hidden"
        style={{ background: '#0A0908' }}
      >
        <FadingVideo
          src="/videos/aurea-capabilities-system.mp4"
          className="absolute inset-0 w-full h-full object-cover z-0"
        />
        <div
          className="absolute inset-0 z-[1] pointer-events-none"
          style={{ background: 'linear-gradient(180deg, transparent 55%, rgba(10,9,8,0.6) 100%)' }}
          aria-hidden="true"
        />

        <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen">
          <motion.div
            initial={{ filter: 'blur(10px)', opacity: 0, y: 24 }}
            whileInView={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
            transition={{ duration: 0.7, ease: 'easeOut' }}
            viewport={{ once: true, amount: 0.2 }}
          >
            <div className="text-sm font-body text-[#E8E2D3]/80 mb-6 tracking-wide">
              // PatientFlow System
            </div>
            <h2 className="font-heading italic text-[#F5F1E8] text-5xl sm:text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">
              El proceso que convierte<br />atención en citas
            </h2>
            <p className="mt-5 max-w-2xl text-sm md:text-base text-[#E8E2D3]/85 font-body font-light leading-tight">
              No se trata de conseguir más mensajes. Se trata de que cada oportunidad tenga una respuesta, un filtro y un siguiente paso claro.
            </p>
          </motion.div>

          <div className="relative mt-16 flex-1">
            {/* Animated golden connecting line — desktop only */}
            <svg
              className="absolute hidden xl:block pointer-events-none"
              style={{ top: '40%', left: 0, right: 0, width: '100%', height: 60, zIndex: 0 }}
              preserveAspectRatio="none"
              viewBox="0 0 1200 60"
              aria-hidden="true"
            >
              <motion.path
                d="M 60 30 Q 240 0, 300 30 T 600 30 T 900 30 T 1140 30"
                stroke="#C9A668"
                strokeWidth="1.4"
                fill="none"
                opacity="0.18"
                strokeDasharray="6 8"
                initial={{ strokeDashoffset: 0 }}
                animate={{ strokeDashoffset: -200 }}
                transition={{ duration: 14, ease: 'linear', repeat: Infinity }}
              />
            </svg>

            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-5 relative" style={{ zIndex: 1 }}>
              {CARDS.map((c, i) => <PatientCard key={c.title} c={c} i={i} />)}
            </div>
          </div>
        </div>
      </section>
    );

    /* ============================================================
     *  App
     * ========================================================== */
    const App = () => (
      <React.Fragment>
        <Hero />
        <Capabilities />
      </React.Fragment>
    );

    window.AureaApp = App;

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
