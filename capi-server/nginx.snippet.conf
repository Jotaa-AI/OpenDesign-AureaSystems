# Aurea CAPI — paste inside the `server { }` block of aureasystems.es
# (usually /etc/nginx/sites-available/aureasystems.es.conf)
#
# After editing: `nginx -t && systemctl reload nginx`

location = /api/capi/event {
  # Only accept POST + the health check
  limit_except POST OPTIONS { deny all; }

  proxy_pass http://127.0.0.1:3001/event;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;
  proxy_set_header User-Agent $http_user_agent;
  proxy_read_timeout 5s;
  proxy_connect_timeout 3s;
  proxy_send_timeout 4s;

  # Don't buffer — keep latency low
  proxy_request_buffering off;
  proxy_buffering off;

  # Limit body size to avoid abuse
  client_max_body_size 32k;
}

location = /api/capi/health {
  proxy_pass http://127.0.0.1:3001/health;
  proxy_connect_timeout 2s;
  proxy_read_timeout 2s;
  access_log off;
}
